services:
  knots:
    image: ghcr.io/andygodish/bitcoin-knots:v29.3.knots20260508-3
    stop_grace_period: 10m  # Tells Docker to wait up to 10 minutes before executing a SIGKILL
    pull_policy: always
    container_name: personal-node-knots
    restart: unless-stopped
    volumes:
      - bitcoin_data_dir:/home/bitcoin/.bitcoin
    ports:
      - "8333:8333"
      - "127.0.0.1:8332:8332"

  electrs:
    image: ghcr.io/andygodish/electrs:v0.11.1-3
    pull_policy: always
    container_name: personal-node-electrs
    restart: unless-stopped
    user: "10002:10001" # <--- Added group 10001 (Knots group)
    depends_on:
      - knots
    volumes:
      - bitcoin_data_dir:/bitcoin-data:ro 
      - electrs_index_dir:/db
    ports:
      - "50001:50001"
    command:
      - --log-filters=INFO
      - --network=bitcoin
      - --daemon-rpc-addr=knots:8332
      - --daemon-p2p-addr=knots:8333
      - --daemon-dir=/bitcoin-data
      - --cookie-file=/bitcoin-data/.cookie
      - --db-dir=/db
      - --electrum-rpc-addr=0.0.0.0:50001

volumes:
  bitcoin_data_dir:
    name: bitcoin_data_dir # <-- Removes the project name prefix (personal-node_bitcoin_data_dir)
  electrs_index_dir:
    name: electrs_index_dir
