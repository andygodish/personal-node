services:
  core:
    image: ghcr.io/andygodish/bitcoin-core:v31.1-0
    stop_grace_period: 10m  # Tells Docker to wait up to 10 minutes before executing a SIGKILL
    pull_policy: always
    container_name: personal-node-core
    restart: unless-stopped
    command:
      - -datadir=/home/bitcoin/.bitcoin
      - -printtoconsole=1
    volumes:
      - bitcoin_data_dir:/home/bitcoin/.bitcoin
    networks:
      default:
        aliases:
          - core
          - personal-node-core
    ports:
      - "8333:8333"
      - "127.0.0.1:8332:8332"

  electrs:
    image: ghcr.io/andygodish/electrs:v0.11.1-4
    pull_policy: always
    container_name: personal-node-electrs
    restart: unless-stopped
    user: "10002:10001"
    depends_on:
      - core
    volumes:
      - bitcoin_data_dir:/bitcoin-data:ro
      - electrs_index_dir:/db
    ports:
      - "50001:50001"

  tor:
    image: ghcr.io/andygodish/tor:v0.4.9.11-0_deb13u1-0
    pull_policy: never
    container_name: personal-node-tor
    restart: unless-stopped
    depends_on:
      - core
    environment:
      KNOTS_SERVICE_HOST: core
      KNOTS_SERVICE_PORT: "8333"
    volumes:
      - tor_data_dir:/var/lib/tor
    ports:
      - "127.0.0.1:9050:9050"

volumes:
  bitcoin_data_dir:
  electrs_index_dir:
  tor_data_dir:
